module:
  - name: serie
    icon: 🎬
    doc: Gestion de série et test des acteurs

classes:
  - !Class
    name: Serie
    attributes:
      - !Attribute {name: titre, type: str}
      - !Attribute {name: acteurs, type: List[str]}
    methods:
      - !Method
        name: ajouter_acteur
        code: |
          self.acteurs.append("TestActeur")
      - !Method
        name: _test_ajouter_acteur
        code: |
          s = type(self)(titre="The Office")
          s.ajouter_acteur()
          assert len(s.acteurs) == 1, "Erreur"

instances:
  - !Scene
    title: Série Tester
    icon: 🎬
    lines: [1, 2, 1]
    
  - !Serie &serie
    titre: Friends

  - !Inspector
    title: Tester
    source: *serie
