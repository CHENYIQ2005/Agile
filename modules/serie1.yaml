!Module
name: serie1
doc: |
  Gérer les séries et les acteurs associés
icon: "🎬"
tag: ""

imports:
  - !Module {name: kore, hidden: True}

classes:
  - !Class
    name: Serie1
    doc: Une série avec titre et liste d'acteurs
    icon: "🎞️"
    bases: [kore.Object]
    attributes:
      - !Attribute {name: titre, type: str}
      - !Attribute {name: acteurs, type: list}
    states: ['vide', 'remplie']
    methods:
      - !Method
        name: ajouter_acteur
        doc: Ajoute un acteur fictif
        postcondition: remplie
        code: |
          self.acteurs.append("Test Acteur")
          self.state = 'remplie'

      - !Method
        name: ajouter_acteur_nom
        doc: Ajoute un acteur donné par l'utilisateur
        parameters:
          - {name: nom, type: str}
        code: |
          self.acteurs.append(nom)
          self.state = 'remplie'

      - !Method
        name: _test_ajouter_acteur
        code: |
          s = type(self)(titre="Astérix", acteurs=[])
          s.ajouter_acteur()
          assert len(s.acteurs) == 1, "❌ Acteur non ajouté"
          assert s.state == 'remplie', "❌ Mauvais état"

      - !Method
        name: _test_ajouter_acteur_nom
        code: |
          s = type(self)(titre="Astérix", acteurs=[])
          s.ajouter_acteur_nom("Monica")
          assert s.acteurs == ["Monica"], "❌ Acteur non ajouté correctement"
          assert s.state == 'remplie', "❌ Mauvais état"

instances:
  - !Scene
    icon: 🎬
    as_name: scene
    title: Série Tester™
    lines: [3, 2, 1]

  - !Text
    icon: 🎯
    title: "Une série avec acteurs?"
    text: |
      Les séries contiennent des acteurs...

  - !Serie1 &Asterix
    titre: "Astérix"
    acteurs: ["chen"]

  - !Inspector
    title: Détails de la série
    source: *Asterix
