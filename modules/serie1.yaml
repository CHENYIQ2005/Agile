!Module
name: serie1
doc: |
  Gérer les séries, les acteurs associés et le nombre de saisons
icon: "🎬"
tag: ""

imports:
  - !Module {name: kore, hidden: True}

classes:
  - !Class
    name: Serie1
    doc: Une série avec titre, liste d'acteurs et nombre de saisons
    icon: "🎞️"
    bases: [kore.Object]
    attributes:
      - !Attribute {name: titre, type: str}
      - !Attribute {name: acteurs, type: list, default: []}
      - !Attribute {name: saisons, type: int, default: 0}
    states: ['vide', 'remplie']
    methods:
      - !Method
        name: ajouter_acteur
        doc: Ajoute un acteur fictif
        postcondition: remplie
        code: |
          self.acteurs.append("Test Acteur")
          self.state = 'remplie'

      - !Method
        name: ajouter_acteur_nom
        doc: Ajoute un acteur donné par l'utilisateur
        parameters:
          - {name: nom, type: str}
        code: |
          self.acteurs.append(nom)
          self.state = 'remplie'

      - !Method
        name: ajouter_saison
        doc: Incrémente le nombre de saisons de 1
        code: |
          self.saisons += 1

      - !Method
        name: ajouter_saisons
        doc: Ajoute un nombre donné de saisons
        parameters:
          - {name: nombre, type: int}
        code: |
          self.saisons += nombre

      - !Method
        name: _test_ajouter_acteur
        code: |
          s = type(self)(titre="Astérix")
          s.ajouter_acteur()
          assert len(s.acteurs) == 1, "❌ Acteur non ajouté"
          assert s.state == 'remplie', "❌ Mauvais état"

      - !Method
        name: _test_ajouter_acteur_nom
        code: |
          s = type(self)(titre="Astérix")
          s.ajouter_acteur_nom("Monica")
          assert s.acteurs == ["Monica"], "❌ Acteur non ajouté correctement"
          assert s.state == 'remplie', "❌ Mauvais état"

      - !Method
        name: _test_ajouter_saison
        code: |
          s = type(self)(titre="Astérix")
          s.ajouter_saison()
          assert s.saisons == 1, "❌ Saison non ajoutée"

      - !Method
        name: _test_ajouter_saisons
        code: |
          s = type(self)(titre="Astérix")
          s.ajouter_saisons(3)
          assert s.saisons == 3, "❌ Saisons non ajoutées correctement"

instances:
  - !Scene
    icon: 🎬
    as_name: scene
    title: Série Tester™
    lines: [4, 3, 2, 1]

  - !Text
    icon: 🎯
    title: "Une série avec acteurs et saisons?"
    text: |
      Les séries contiennent des acteurs et un nombre de saisons...

  - !Serie1 &Asterix
    titre: "Astérix"

  - !Inspector
    title: Détails de la série
    source: *Asterix
