module:
  - name: serie1
    doc: |
      Gérer les séries et les acteurs associés
    icon: "🎬"
    tag: ""

imports:
  - !Module {name: kore, hidden: True}

classes:
  - !Class
    name: Serie1
    doc: Une série avec titre et liste d'acteurs
    icon: "🎞️"
    bases: [kore.Object]
    attributes:
      - !Attribute {name: titre, type: str}
      - !Attribute {name: acteurs, type: list}
      - !Attribute {name: nom, type: str}
    states: ['vide', 'remplie']
    methods:
      - !Method
        name: ajouter_acteur
        doc: Ajoute un acteur fictif
        preconditions: ['vide']
        postcondition: remplie
        code: |
          if not isinstance(self.acteurs, list):
              self.acteurs = []
          self.acteurs.append("Test Acteur")
          self.state = 'remplie'

      - !Method
        name: ajouter_acteur_nom
        doc: Ajoute un acteur personnalisé
        code: |
          if not isinstance(self.acteurs, list):
              self.acteurs = []
          self.acteurs.append(self.nom)
          self.state = 'remplie'

      - !Method
        name: _test_ajouter_acteur
        code: |
          s = type(self)(titre="Friends", acteurs=[], nom="")
          s.ajouter_acteur()
          assert len(s.acteurs) == 1, "❌ Acteur non ajouté"
          assert s.state == 'remplie', "❌ Mauvais état"

instances:
  - !Scene
    icon: 🎬
    as_name: scene
    title: Série Tester™
    lines: [3, 2, 1]

  - !Text
    icon: 🎯
    title: "Pourquoi tester une série ?"
    text: |
      Les séries contiennent des listes d'acteurs...

  - !Serie1 &friends
    value: {titre: "Friends", acteurs: [], nom: ""}

  - !Inspector
    title: Détails de la série
    source: *friends

  - !Form
    title: Ajouter un acteur personnalisé
    attributes: [nom]
    border: True
    subjects: [*friends]
    on_submit:
      - !Function
        code: |
          self.subjects[0].ajouter_acteur_nom()
