!Module
name: serie1
doc: |
  Gérer les séries et les acteurs associés
icon: "🎬"
tag: ""

imports:
  - !Module {name: kore, hidden: True}

classes:
  - !Class
    name: Serie1
    doc: Une série avec titre et liste d'acteurs
    icon: "🎞️"
    bases: [kore.Object]
    attributes:
      - !Attribute {name: titre, type: str}
      - !Attribute {name: acteurs, type: list}
      - !Attribute {name: nb_saisons, type: int, default: 1}
      - !Attribute {name: state, type: str, default: 'vide'}
    states: ['vide', 'remplie']
    methods:
      - !Method
        name: ajouter_acteur
        doc: Ajoute un acteur fictif et passe l'état à 'remplie'
        postcondition: remplie
        code: |
          self.acteurs.append("Test Acteur")
          self.state = 'remplie'

      - !Method
        name: ajouter_acteur_nom
        doc: Ajoute un acteur donné par l'utilisateur et passe l'état à 'remplie'
        parameters:
          - {name: nom, type: str}
        code: |
          self.acteurs.append(nom)
          self.state = 'remplie'

      - !Method
        name: ajouter_saison
        doc: Incrémente le nombre de saisons
        code: |
          self.nb_saisons += 1

      - !Method
        name: _test_ajouter_acteur
        code: |
          s = type(self)(titre="Astérix", acteurs=[], nb_saisons=1)
          s.ajouter_acteur()
          assert len(s.acteurs) == 1, "❌ Acteur non ajouté"
          assert s.state == 'remplie', "❌ Mauvais état"

      - !Method
        name: _test_ajouter_acteur_nom
        code: |
          s = type(self)(titre="Astérix", acteurs=[], nb_saisons=1)
          s.ajouter_acteur_nom("Monica")
          assert s.acteurs == ["Monica"], "❌ Acteur non ajouté correctement"
          assert s.state == 'remplie', "❌ Mauvais état"

      - !Method
        name: _test_ajouter_saison
        code: |
          s = type(self)(titre="Test", acteurs=[], nb_saisons=2)
          s.ajouter_saison()
          assert s.nb_saisons == 3, f"❌ nb_saisons attendu 3, obtenu {s.nb_saisons}"

instances:
  - !Scene
    icon: 🎬
    as_name: scene
    title: Série Tester™
    lines: [3, 2, 1]

  - !Text
    icon: 🎯
    title: "Une série avec acteurs?"
    text: |
      Les séries contiennent des acteurs...

  - !Serie1 &Astérix
    titre: "Astérix"
    acteurs: ["chen"]
    nb_saisons: 1
    state: remplie

  - !Inspector
    title: Détails de la série
    source: *Astérix
